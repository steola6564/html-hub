<template id="view-home"><section class="lead"><p class="eyebrow">ENGLISH · JAPANESE BILINGUAL READER</p><h1>Irregular Verbs 100<br/>不規則動詞を100文で学ぶ</h1><p class="lede">Oxford Word Skills Elementary → Intermediate → Practical English Usage。<strong>137動詞を100例文に配置</strong>し、それぞれの過去形・過去分詞を同一英文内で使っています。</p><p>オフラインで開ける単一HTMLです。章を選ぶとその20文だけを表示し、検索・動詞索引からは一文だけを開けます。日本語訳のホバー／タップ表示や常時表示も利用できます。</p><div class="stats"><div class="stat"><b>100</b><span>例文</span></div><div class="stat"><b>137</b><span>不規則動詞</span></div><div class="stat"><b>E 79</b><span>Elementary</span></div><div class="stat"><b>I 31</b><span>Intermediate追加</span></div><div class="stat"><b>PEU 27</b><span>PEU追加</span></div></div><div class="legend"><span><strong class="verb past">過去形</strong>：例文中の過去形</span><span><strong class="verb participle">過去分詞</strong>：例文中の過去分詞</span><span>英文をホバー／タップすると日本語訳を表示</span></div><p class="about">英語本文の一般語彙はall.csvの見出し語（その通常の屈折形を含む）に限定。ただし対象137語のうち、all.csvに見出し語がない7動詞は学習対象を完備するための明示的な例外です。<a href="#/scope">例外と検証範囲</a></p></section><section class="section-header"><h2>5つの巻</h2></section><div class="cards"><a class="chapter-card" href="#/chapter/1"><span>VOLUME 01 · 001–020</span><h2>はじまりの問い</h2><p>The First Questions / 20例文</p><span>読む →</span></a><a class="chapter-card" href="#/chapter/2"><span>VOLUME 02 · 021–040</span><h2>川と道の記憶</h2><p>The River and the Road / 20例文</p><span>読む →</span></a><a class="chapter-card" href="#/chapter/3"><span>VOLUME 03 · 041–060</span><h2>言葉と選択</h2><p>Words and Decisions / 20例文</p><span>読む →</span></a><a class="chapter-card" href="#/chapter/4"><span>VOLUME 04 · 061–080</span><h2>暮らしの手触り</h2><p>Everyday Life / 20例文</p><span>読む →</span></a><a class="chapter-card" href="#/chapter/5"><span>VOLUME 05 · 081–100</span><h2>次の朝へ</h2><p>The Next Morning / 20例文</p><span>読む →</span></a></div><section class="panel startlinks"><h2>すぐに開く</h2><p>学習単位は、巻ごとに20文、または検索結果から一文ずつ選べます。</p><div class="quicklinks"><a class="navlink" href="#/chapter/1">第1巻を読む</a><a class="navlink" <template id="view-scope"><section class="panel" id="scope"><h2>語彙制約と検証範囲</h2><p>対象はE・I・PEUの137レコードに限定しています。<strong>各対象動詞の過去形・過去分詞を、該当する一文内で実際に使う</strong>ことを条件にしています。活用形が同じ綴りの場合も、別の出現箇所で使っています。</p><p>本文の語彙は、all.csvのWORD欄にある見出し語と、その一般的な複数形・過去形・比較級等に限定しています。ただし、<strong>awake, kneel, oversleep, sew, spit, sting, undo</strong>の7動詞はall.csvの見出し語にないため、この二つの条件を同時に満たすことは不可能です。これら7動詞の活用だけを例外として収録し、その他の独立した語彙の追加は認めていません。</p><p>不規則動詞の活用はOxford_Irregular_Verbs_Consolidated_V2.csvに基づいています。<em>leant, learnt, smelt, sped, spilt, spoilt</em>等は資料にあるBritish Englishの代替形を使用。<em>read</em> は過去形・過去分詞とも同じ綴りですが、いずれも /red/ で発音します。</p><p>なお、<em>had</em>のような助動詞としての使用は文の時制を作る働きであり、「その文で主動詞として学習対象にした動詞」とは区別しています。<em>have</em>を主動詞として扱う第39文には、過去形と過去分詞の両方があります。</p><p>100例文と137語の索引は、このHTML内に一体化しています。元の教材にあった検証資料・CSVはHTMLには依存しません。</p></section></template>
<template id="view-help"><section class="lead"><p class="eyebrow">GUIDE</p><h1>使い方</h1><p>一つのHTMLに、100例文・英日対訳・5つの巻・137語の索引を収納しています。外部CSSやJavaScript、ネットワーク通信は不要です。</p></section>
<section class="panel"><h2>読む・探す</h2><p>左の目次（スマートフォンでは折りたたみ式）から巻を選ぶと、その巻の20文だけを表示します。共通検索・動詞索引からは該当する一文だけを開けます。前の文／次の文でも移動できます。</p><h2>英日対訳</h2><p>英文をマウスでホバーすると訳が表示されます。スマートフォンでは英文をタップすると訳が表示され、再タップで閉じます。上部の「対訳を常に表示」で訳の一覧表示に切り替えられます。</p><h2>強調表示</h2><p><strong class="verb past">過去形</strong>と<strong class="verb participle">過去分詞</strong>を色分けしています。例文中で同じ動詞の両形を確認できます。</p><h2>保存と共有</h2><p>URLの末尾にある <code>#/sentence/001</code> などが現在の表示位置です。ブラウザーの戻る・進む、ブックマークも利用できます。このHTMLファイル自体を移動・コピーしても動作します。</p></section></template>
<template id="view-chapter-1"><section class="lead"><p class="eyebrow">Volume 01 · Sentences 001–020</p><h1>はじまりの問い</h1><p class="lede">The First Questions · 英文と訳を一文ずつ対応させ、過去形と過去分詞を同じ文の中で確認します。</p><div class="legend"><span><strong class="verb past">過去形</strong>：例文中の過去形</span><span><strong class="verb participle">過去分詞</strong>：例文中の過去分詞</span><span>英文をホバー／タップすると日本語訳を表示</span></div><p class="about">E・I・PEUに含まれる137レコードのみを学習対象とし、P・OALD限定レコードは扱いません。</p></section><div class="examples"><article class="example" data-number="1" id="s001"><header class="example-head"><span class="folio">001</span><div class="tag-list"><a class="tag" href="#/word/arise" title="arise · PEU">arise · PEU</a><a class="tag" href="#/word/begin" title="begin · E">begin · E</a></div></header><span class="pair"><span aria-describedby="tr-001" class="utter" lang="en-GB" tabindex="0">A new question <strong class="verb past" data-verb="arise" title="arise · 過去形">arose</strong> after the meeting had <strong class="verb participle" data-verb="begin" title="begin · 過去分詞">begun</strong>, although a similar question had <strong class="verb participle" data-verb="arise" title="arise · 過去分詞">arisen</strong> before the first speaker <strong class="verb past" data-verb="begin" title="begin · 過去形">began</strong>.</span><span class="trans" id="tr-001" lang="ja">会議が始まってから新たな疑問が生じたが、最初の発言者が話し始める前にも似た疑問が生じていた。</span></span></article><article class="example" data-number="2" id="s002"><header class="example-head"><span class="folio">002</span><div class="tag-list"><a class="tag" href="#/word/awake" title="awake · PEU">awake · PEU</a><a class="tag" href="#/word/dream" title="dream · E">dream · E</a></div></header><span class="pair"><span aria-describedby="tr-002" class="utter" lang="en-GB" tabindex="0">The girl <strong class="verb past" data-verb="awake" title="awake · 過去形">awoke</strong> after she had <strong class="verb participle" data-verb="dream" title="dream · 過去分詞">dreamt</strong> of the river, and her brother <strong class="verb past" data-verb="dream" title="dream · 過去形">dreamt</strong> of the sea after he had <strong class="verb participle" data-verb="awake" title="awake · 過去分詞">awoken</strong> earlier.</span><span class="trans" id="tr-002" lang="ja">少女は川の夢を見た後に目覚め、弟はもっと早く目覚めてから海の夢を見た。</span></span></article><article class="example" data-number="3" id="s003"><header class="example-head"><span class="folio">003</span><div class="tag-list"><a class="tag" href="#/word/be" title="be · E">be · E</a><a class="tag" href="#/word/become" title="become · E">become · E</a></div></header><span class="pair"><span aria-describedby="tr-003" class="utter" lang="en-GB" tabindex="0">The room <strong class="verb past" data-verb="be" title="be · 過去形">was</strong> quiet because it had <strong class="verb participle" data-verb="be" title="be · 過去分詞">been</strong> empty, but it <strong class="verb past" data-verb="become" title="become · 過去形">became</strong> lively after it had <strong class="verb participle" data-verb="become" title="become · 過去分詞">become</strong> a meeting place.</span><span class="trans" id="tr-003" lang="ja">その部屋は空っぽだったので静かだったが、人々の集まる場所になってから活気づいた。</span></span></article><article class="example" data-number="4" id="s004"><header class="example-head"><span class="folio">004</span><div class="tag-list"><a class="tag" href="#/word/bear" title="bear · PEU">bear · PEU</a><a class="tag" href="#/word/bring" title="bring · E">bring · E</a></div></header><span class="pair"><span aria-describedby="tr-004" class="utter" lang="en-GB" tabindex="0">She <strong class="verb past" data-verb="bear" title="bear · 過去形">bore</strong> the weight of the box after she had <strong class="verb participle" data-verb="bear" title="bear · 過去分詞">borne</strong> a heavier one, and her friend <strong class="verb past" data-verb="bring" title="bring · 過去形">brought</strong> the key he had <strong class="verb participle" data-verb="bring" title="bring · 過去分詞">brought</strong> yesterday.</span><span class="trans" id="tr-004" lang="ja">彼女は以前もっと重い箱を運んだ経験があり、その箱の重さにも耐えた。そして友人は昨日も持ってきた鍵を持ってきた。</span></span></article><article class="example" data-number="5" id="s005"><header class="example-head"><span class="folio">005</span><div class="tag-list"><a class="tag" href="#/word/beat" title="beat · E">beat · E</a><a class="tag" href="#/word/break" title="break · E">break · E</a></div></header><span class="pair"><span aria-describedby="tr-005" class="utter" lang="en-GB" tabindex="0">The rain <strong class="verb past" data-verb="beat" title="beat · 過去形">beat</strong> against the window after it had <strong class="verb participle" data-verb="beat" title="beat · 過去分詞">beaten</strong> the roof, and the wind <strong class="verb past" data-verb="break" title="break · 過去形">broke</strong> a branch after another storm had <strong class="verb participle" data-verb="break" title="break · 過去分詞">broken</strong> a tree.</span><span class="trans" id="tr-005" lang="ja">雨は屋根を打った後で窓を打ち、風は枝を折り、それより前には別の嵐が木を折っていた。</span></span></article><article class="example" data-number="6" id="s006"><header class="example-head"><span class="folio">006</span><div class="tag-list"><a class="tag" href="#/word/bend" title="bend · I">bend · I</a><a class="tag" href="#/word/bind" title="bind · PEU">bind · PEU</a></div></header><span class="pair"><span aria-describedby="tr-006" class="utter" lang="en-GB" tabindex="0">She <strong class="verb past" data-verb="bend" title="bend · 過去形">bent</strong> the wire as she had <strong class="verb participle" data-verb="bend" title="bend · 過去分詞">bent</strong> it before, then <strong class="verb past" data-verb="bind" title="bind · 過去形">bound</strong> the pieces with the rope she had <strong class="verb participle" data-verb="bind" title="bind · 過去分詞">bound</strong> around the box.</span><span class="trans" id="tr-006" lang="ja">彼女は以前と同じように針金を曲げ、箱に巻いたことのあるロープで部品を縛った。</span></span></article><article class="example" data-number="7" id="s007"><header class="example-head"><span class="folio">007</span><div class="tag-list"><a class="tag" href="#/word/bet" title="bet · PEU">bet · PEU</a><a class="tag" href="#/word/buy" title="buy · E">buy · E</a></div></header><span class="pair"><span aria-describedby="tr-007" class="utter" lang="en-GB" tabindex="0">He <strong class="verb past" data-verb="bet" title="bet · 過去形">bet</strong> on the match after he had <strong class="verb participle" data-verb="bet" title="bet · 過去分詞">bet</strong> before, but he <strong class="verb past" data-verb="buy" title="buy · 過去形">bought</strong> a ticket only after his sister had <strong class="verb participle" data-verb="buy" title="buy · 過去分詞">bought</strong> one.</span><span class="trans" id="tr-007" lang="ja">彼は以前も賭けた試合に再び賭けたが、チケットを買ったのは姉が先に買ってからだった。</span></span></article><article class="example" data-number="8" id="s008"><header class="example-head"><span class="folio">008</span><div class="tag-list"><a class="tag" href="#/word/bite" title="bite · I">bite · I</a><a class="tag" href="#/word/bleed" title="bleed · I">bleed · I</a></div></header><span class="pair"><span aria-describedby="tr-008" class="utter" lang="en-GB" tabindex="0">The child <strong class="verb past" data-verb="bite" title="bite · 過去形">bit</strong> his lip just as he had <strong class="verb participle" data-verb="bite" title="bite · 過去分詞">bitten</strong> it yesterday, and the small cut <strong class="verb past" data-verb="bleed" title="bleed · 過去形">bled</strong> as it had <strong class="verb participle" data-verb="bleed" title="bleed · 過去分詞">bled</strong> before.</span><span class="trans" id="tr-008" lang="ja">子どもは昨日と同じように唇をかみ、小さな傷口は前と同じように血を流した。</span></span></article><article class="example" data-number="9" id="s009"><header class="example-head"><span class="folio">009</span><div class="tag-list"><a class="tag" href="#/word/blow" title="blow · E">blow · E</a><a class="tag" href="#/word/burn" title="burn · E">burn · E</a></div></header><span class="pair"><span aria-describedby="tr-009" class="utter" lang="en-GB" tabindex="0">The wind <strong class="verb past" data-verb="blow" title="blow · 過去形">blew</strong> across the field as it had <strong class="verb participle" data-verb="blow" title="blow · 過去分詞">blown</strong> all night, and the fire <strong class="verb past" data-verb="burn" title="burn · 過去形">burnt</strong> the dry wood after it had <strong class="verb participle" data-verb="burn" title="burn · 過去分詞">burnt</strong> the old grass.</span><span class="trans" id="tr-009" lang="ja">風は夜通し吹いていたように野原を吹き抜け、火は古い草を燃やした後で乾いた木を燃やした。</span></span></article><article class="example" data-number="10" id="s010"><header class="example-head"><span class="folio">010</span><div class="tag-list"><a class="tag" href="#/word/broadcast" title="broadcast · PEU">broadcast · PEU</a><a class="tag" href="#/word/say" title="say · E">say · E</a></div></header><span class="pair"><span aria-describedby="tr-010" class="utter" lang="en-GB" tabindex="0">The station <strong class="verb past" data-verb="broadcast" title="broadcast · 過去形">broadcast</strong> the news after it had <strong class="verb participle" data-verb="broadcast" title="broadcast · 過去分詞">broadcast</strong> a warning, and the mayor <strong class="verb past" data-verb="say" title="say · 過去形">said</strong> what she had <strong class="verb participle" data-verb="say" title="say · 過去分詞">said</strong> before.</span><span class="trans" id="tr-010" lang="ja">放送局は警告を流した後でニュースを放送し、市長は以前にも述べたことを再び述べた。</span></span></article><article class="example" data-number="11" id="s011"><header class="example-head"><span class="folio">011</span><div class="tag-list"><a class="tag" href="#/word/build" title="build · E">build · E</a><a class="tag" href="#/word/grow" title="grow · E">grow · E</a></div></header><span class="pair"><span aria-describedby="tr-011" class="utter" lang="en-GB" tabindex="0">The town <strong class="verb past" data-verb="build" title="build · 過去形">built</strong> a new garden where it had <strong class="verb participle" data-verb="build" title="build · 過去分詞">built</strong> a wall, and flowers <strong class="verb past" data-verb="grow" title="grow · 過去形">grew</strong> where trees had <strong class="verb participle" data-verb="grow" title="grow · 過去分詞">grown</strong> years ago.</span><span class="trans" id="tr-011" lang="ja">町はかつて壁を建てた場所に新しい庭園を造り、何年も前に木が育った場所に花が育った。</span></span></article><article class="example" data-number="12" id="s012"><header class="example-head"><span class="folio">012</span><div class="tag-list"><a class="tag" href="#/word/burst" title="burst · I">burst · I</a><a class="tag" href="#/word/cut" title="cut · E">cut · E</a></div></header><span class="pair"><span aria-describedby="tr-012" class="utter" lang="en-GB" tabindex="0">The pipe <strong class="verb past" data-verb="burst" title="burst · 過去形">burst</strong> as another pipe had <strong class="verb participle" data-verb="burst" title="burst · 過去分詞">burst</strong> last winter, and the engineer <strong class="verb past" data-verb="cut" title="cut · 過去形">cut</strong> the water supply after a colleague had <strong class="verb participle" data-verb="cut" title="cut · 過去分詞">cut</strong> the power.</span><span class="trans" id="tr-012" lang="ja">去年の冬に別の管が破裂したのと同じように管が破裂し、技師は同僚が電源を切った後で給水を止めた。</span></span></article><article class="example" data-number="13" id="s013"><header class="example-head"><span class="folio">013</span><div class="tag-list"><a class="tag" href="#/word/catch" title="catch · E">catch · E</a><a class="tag" href="#/word/find" title="find · E">find · E</a></div></header><span class="pair"><span aria-describedby="tr-013" class="utter" lang="en-GB" tabindex="0">The teacher <strong class="verb past" data-verb="catch" title="catch · 過去形">caught</strong> the mistake that the student had <strong class="verb participle" data-verb="catch" title="catch · 過去分詞">caught</strong> earlier and <strong class="verb past" data-verb="find" title="find · 過去形">found</strong> the answer that her friend had <strong class="verb participle" data-verb="find" title="find · 過去分詞">found</strong>.</span><span class="trans" id="tr-013" lang="ja">教師は学生が先に見つけた誤りに気づき、友人が見つけた答えを見つけた。</span></span></article><article class="example" data-number="14" id="s014"><header class="example-head"><span class="folio">014</span><div class="tag-list"><a class="tag" href="#/word/choose" title="choose · E">choose · E</a><a class="tag" href="#/word/take" title="take · E">take · E</a></div></header><span class="pair"><span aria-describedby="tr-014" class="utter" lang="en-GB" tabindex="0">She <strong class="verb past" data-verb="choose" title="choose · 過去形">chose</strong> the blue coat she had <strong class="verb participle" data-verb="choose" title="choose · 過去分詞">chosen</strong> before and <strong class="verb past" data-verb="take" title="take · 過去形">took</strong> the bag her brother had <strong class="verb participle" data-verb="take" title="take · 過去分詞">taken</strong> to school.</span><span class="trans" id="tr-014" lang="ja">彼女は以前にも選んだ青いコートを選び、弟が学校に持っていったバッグを持っていった。</span></span></article><article class="example" data-number="15" id="s015"><header class="example-head"><span class="folio">015</span><div class="tag-list"><a class="tag" href="#/word/come" title="come · E">come · E</a><a class="tag" href="#/word/go" title="go · E">go · E</a></div></header><span class="pair"><span aria-describedby="tr-015" class="utter" lang="en-GB" tabindex="0">The train <strong class="verb past" data-verb="come" title="come · 過去形">came</strong> late although it had <strong class="verb participle" data-verb="come" title="come · 過去分詞">come</strong> early yesterday, and the passengers <strong class="verb past" data-verb="go" title="go · 過去形">went</strong> home after they had <strong class="verb participle" data-verb="go" title="go · 過去分詞">gone</strong> to the wrong station.</span><span class="trans" id="tr-015" lang="ja">列車は昨日は早く来たのに今日は遅く来て、乗客たちは間違った駅に行ってしまった後で帰宅した。</span></span></article><article class="example" data-number="16" id="s016"><header class="example-head"><span class="folio">016</span><div class="tag-list"><a class="tag" href="#/word/cost" title="cost · E">cost · E</a><a class="tag" href="#/word/pay" title="pay · E">pay · E</a></div></header><span class="pair"><span aria-describedby="tr-016" class="utter" lang="en-GB" tabindex="0">The repair <strong class="verb past" data-verb="cost" title="cost · 過去形">cost</strong> more than it had <strong class="verb participle" data-verb="cost" title="cost · 過去分詞">cost</strong> last year, and the owner <strong class="verb past" data-verb="pay" title="pay · 過去形">paid</strong> the bill after she had <strong class="verb participle" data-verb="pay" title="pay · 過去分詞">paid</strong> for the parts.</span><span class="trans" id="tr-016" lang="ja">修理代は去年より高くつき、持ち主は部品代を払った後で請求書の代金も支払った。</span></span></article><article class="example" data-number="17" id="s017"><header class="example-head"><span class="folio">017</span><div class="tag-list"><a class="tag" href="#/word/deal" title="deal · I">deal · I</a><a class="tag" href="#/word/do" title="do · E">do · E</a></div></header><span class="pair"><span aria-describedby="tr-017" class="utter" lang="en-GB" tabindex="0">The team <strong class="verb past" data-verb="deal" title="deal · 過去形">dealt</strong> with the problem as it had <strong class="verb participle" data-verb="deal" title="deal · 過去分詞">dealt</strong> with earlier problems, and each member <strong class="verb past" data-verb="do" title="do · 過去形">did</strong> the work they had <strong class="verb participle" data-verb="do" title="do · 過去分詞">done</strong> before.</span><span class="trans" id="tr-017" lang="ja">チームは以前の問題と同じように今回の問題に対処し、各メンバーは以前にも担当した仕事を行った。</span></span></article><article class="example" data-number="18" id="s018"><header class="example-head"><span class="folio">018</span><div class="tag-list"><a class="tag" href="#/word/dig" title="dig · PEU">dig · PEU</a><a class="tag" href="#/word/fall" title="fall · E">fall · E</a></div></header><span class="pair"><span aria-describedby="tr-018" class="utter" lang="en-GB" tabindex="0">The workers <strong class="verb past" data-verb="dig" title="dig · 過去形">dug</strong> near the river where others had <strong class="verb participle" data-verb="dig" title="dig · 過去分詞">dug</strong> before, and a stone <strong class="verb past" data-verb="fall" title="fall · 過去形">fell</strong> into the hole after another had <strong class="verb participle" data-verb="fall" title="fall · 過去分詞">fallen</strong> there.</span><span class="trans" id="tr-018" lang="ja">作業員たちは以前ほかの人が掘った川の近くを掘り、石が別の石の後から穴に落ちた。</span></span></article><article class="example" data-number="19" id="s019"><header class="example-head"><span class="folio">019</span><div class="tag-list"><a class="tag" href="#/word/dive" title="dive · PEU">dive · PEU</a><a class="tag" href="#/word/swim" title="swim · E">swim · E</a></div></header><span class="pair"><span aria-describedby="tr-019" class="utter" lang="en-GB" tabindex="0">She <strong class="verb past" data-verb="dive" title="dive · 過去形">dived</strong> into the lake where she had <strong class="verb participle" data-verb="dive" title="dive · 過去分詞">dived</strong> last summer, then <strong class="verb past" data-verb="swim" title="swim · 過去形">swam</strong> to the bank she had <strong class="verb participle" data-verb="swim" title="swim · 過去分詞">swum</strong> towards as a child.</span><span class="trans" id="tr-019" lang="ja">彼女は去年の夏にも飛び込んだ湖に飛び込み、子どもの頃にも泳いで向かった岸まで泳いだ。</span></span></article><article class="example" data-number="20" id="s020"><header class="example-head"><span class="folio">020</span><div class="tag-list"><a class="tag" href="#/word/draw" title="draw · E">draw · E</a><a class="tag" href="#/word/show" title="show · E">show · E</a></div></header><span class="pair"><span aria-describedby="tr-020" class="utter" lang="en-GB" tabindex="0">He <strong class="verb past" data-verb="draw" title="draw · 過去形">drew</strong> a map like the one he had <strong class="verb participle" data-verb="draw" title="draw · 過去分詞">drawn</strong> before and <strong class="verb past" data-verb="show" title="show · 過去形">showed</strong> it to the friend who had <strong class="verb participle" data-verb="show" title="show · 過去分詞">shown</strong> him the old path.</span><span class="trans" id="tr-020" lang="ja">彼は以前描いたものに似た地図を描き、昔の道を教えてくれた友人にそれを見せた。</span></span></article></div><nav aria-label="巻移動" class="movement"><a href="#/words">共通Indexと語彙索引</a><a href="#/chapter/2">次の巻 →</a></nav></template>

rse she had <strong class="verb participle" data-verb="ride" title="ride · 過去分詞">ridden</strong> before.</span><span class="trans" id="tr-022" lang="ja">彼は長年運転してきた車を運転し、彼女は以前乗ったことのある馬に乗った。</span></span></article><article class="example" data-number="23" id="s023"><header class="example-head"><span class="folio">023</span><div class="tag-list"><a class="tag" href="#/word/feed" title="feed · PEU">feed · PEU</a><a class="tag" href="#/word/give" title="give · E">give · E</a></div></header><span class="pair"><span aria-describedby="tr-023" class="utter" lang="en-GB" tabindex="0">The farmer <strong class="verb past" data-verb="feed" title="feed · 過去形">fed</strong> the birds as she had <strong class="verb participle" data-verb="feed" title="feed · 過去分詞">fed</strong> them all winter and <strong class="verb past" data-verb="give" title="give · 過去形">gave</strong> the children the food she had <strong class="verb participle" data-verb="give" title="give · 過去分詞">given</strong> their parents.</span><span class="trans" id="tr-023" lang="ja">農家の女性は冬じゅうしてきたように鳥に餌をやり、子どもたちには以前その親にも渡した食べ物を渡した。</span></span></article><article class="example" data-number="24" id="s024"><header class="example-head"><span class="folio">024</span><div class="tag-list"><a class="tag" href="#/word/feel" title="feel · E">feel · E</a><a class="tag" href="#/word/know" title="know · E">know · E</a></div></header><span class="pair"><span aria-describedby="tr-024" class="utter" lang="en-GB" tabindex="0">She <strong class="verb past" data-verb="feel" title="feel · 過去形">felt</strong> the fear she had <strong class="verb participle" data-verb="feel" title="feel · 過去分詞">felt</strong> before, yet she <strong class="verb past" data-verb="know" title="know · 過去形">knew</strong> the path because she had <strong class="verb participle" data-verb="know" title="know · 過去分詞">known</strong> it since childhood.</span><span class="trans" id="tr-024" lang="ja">彼女は以前にも感じた恐怖を感じたが、幼い頃から知っている道なので進む方向は分かっていた。</span></span></article><article class="example" data-number="25" id="s025"><header class="example-head"><span class="folio">025</span><div class="tag-list"><a class="tag" href="#/word/fight" title="fight · E">fight · E</a><a class="tag" href="#/word/win" title="win · E">win · E</a></div></header><span class="pair"><span aria-describedby="tr-025" class="utter" lang="en-GB" tabindex="0">They <strong class="verb past" data-verb="fight" title="fight · 過去形">fought</strong> for the prize as they had <strong class="verb participle" data-verb="fight" title="fight · 過去分詞">fought</strong> the year before, and this time they <strong class="verb past" data-verb="win" title="win · 過去形">won</strong> what they had never <strong class="verb participle" data-verb="win" title="win · 過去分詞">won</strong> before.</span><span class="trans" id="tr-025" lang="ja">彼らは前年と同じように賞を目指して戦い、今回はそれまで一度も勝ち取れなかったものを手にした。</span></span></article><article class="example" data-number="26" id="s026"><header class="example-head"><span class="folio">026</span><div class="tag-list"><a class="tag" href="#/word/fit" title="fit · PEU">fit · PEU</a><a class="tag" href="#/word/wear" title="wear · E">wear · E</a></div></header><span class="pair"><span aria-describedby="tr-026" class="utter" lang="en-GB" tabindex="0">The old coat <strong class="verb past" data-verb="fit" title="fit · 過去形">fitted</strong> him better than it had <strong class="verb participle" data-verb="fit" title="fit · 過去分詞">fitted</strong> him last year, so he <strong class="verb past" data-verb="wear" title="wear · 過去形">wore</strong> the coat he had <strong class="verb participle" data-verb="wear" title="wear · 過去分詞">worn</strong> to school.</span><span class="trans" id="tr-026" lang="ja">その古いコートは去年よりよく体に合ったので、彼は以前学校に着ていったそのコートを着た。</span></span></article><article class="example" data-number="27" id="s027"><header class="example-head"><span class="folio">027</span><div class="tag-list"><a class="tag" href="#/word/flee" title="flee · PEU">flee · PEU</a><a class="tag" href=" /span></article><article class="example" data-number="34" id="s034"><header class="example-head"><span class="folio">034</span><div class="tag-list"><a class="tag" href="#/word/hear" title="hear · E">hear · E</a><a class="tag" href="#/word/speak" title="speak · E">speak · E</a></div></header><span class="pair"><span aria-describedby="tr-034" class="utter" lang="en-GB" tabindex="0">He <strong class="verb past" data-verb="hear" title="hear · 過去形">heard</strong> the story he had <strong class="verb participle" data-verb="hear" title="hear · 過去分詞">heard</strong> as a child and <strong class="verb past" data-verb="speak" title="speak · 過去形">spoke</strong> the words his father had <strong class="verb participle" data-verb="speak" title="speak · 過去分詞">spoken</strong> before.</span><span class="trans" id="tr-034" lang="ja">彼は子どもの頃に聞いた物語を再び聞き、父がかつて語った言葉を口にした。</span></span></article><article class="example" data-number="35" id="s035"><header class="example-head"><span class="folio">035</span><div class="tag-list"><a class="tag" href="#/word/hide" title="hide · I">hide · I</a><a class="tag" href="#/word/keep" title="keep · E">keep · E</a></div></header><span class="pair"><span aria-describedby="tr-035" class="utter" lang="en-GB" tabindex="0">She <strong class="verb past" data-verb="hide" title="hide · 過去形">hid</strong> the letter where she had <strong class="verb participle" data-verb="hide" title="hide · 過去分詞">hidden</strong> the key and <strong class="verb past" data-verb="keep" title="keep · 過去形">kept</strong> the secret she had <strong class="verb participle" data-verb="keep" title="keep · 過去分詞">kept</strong> for years.</span><span class="trans" id="tr-035" lang="ja">彼女は鍵を隠した場所に手紙を隠し、何年も守ってきた秘密を守り続けた。</span></span></article><article class="example" data-number="36" id="s036"><header class="example-head"><span class="folio">036</span><div class="tag-list"><a class="tag" href="#/word/hit" title="hit · E">hit · E</a><a class="tag" href="#/word/shoot" title="shoot · I">shoot · I</a></div></header><span class="pair"><span aria-describedby="tr-036" class="utter" lang="en-GB" tabindex="0">The ball <strong class="verb past" data-verb="hit" title="hit · 過去形">hit</strong> the wall where another ball had <strong class="verb participle" data-verb="hit" title="hit · 過去分詞">hit</strong> it, and the player <strong class="verb past" data-verb="shoot" title="shoot · 過去形">shot</strong> again after he had <strong class="verb participle" data-verb="shoot" title="shoot · 過去分詞">shot</strong> once before.</span><span class="trans" id="tr-036" lang="ja">ボールは別のボールが当たった壁の場所に当たり、選手はすでに一度打った後でもう一度シュートした。</span></span></article><article class="example" data-number="37" id="s037"><header class="example-head"><span class="folio">037</span><div class="tag-list"><a class="tag" href="#/word/kneel" title="kneel · PEU">kneel · PEU</a><a class="tag" href="#/word/stand" title="stand · E">stand · E</a></div></header><span class="pair"><span aria-describedby="tr-037" class="utter" lang="en-GB" tabindex="0">The boy <strong class="verb past" data-verb="kneel" title="kneel · 過去形">knelt</strong> beside the bed where his father had <strong class="verb participle" data-verb="kneel" title="kneel · 過去分詞">knelt</strong>, then <strong class="verb past" data-verb="stand" title="stand · 過去形">stood</strong> by the window where his mother had <strong class="verb participle" data-verb="stand" title="stand · 過去分詞">stood</strong>.</span><span class="trans" id="tr-037" lang="ja">少年は父がひざまずいたベッドのそばにひざまずき、その後で母が立っていた窓辺に立った。</span></span></article><article class="example" data-number="38" id="s038"><header class="example-head"><span class="folio">038</span><div class="tag-list"><a class="tag" href="#/word/forget" title="forget · E">forget · E</a></div></header><span class="pair"><span aria-describedby="tr-038" class="utter" lang="en-GB" tabindex="0">She <strong class="verb past" data-verb="forget" title="forget · 過去形">forgot</strong> the name that she had <strong class="verb participle" data-verb="forget" title="forget · 過去分詞">forgotten</strong> once before.</span><span class="trans" id="tr-038" lang="ja">彼女は以前にも一度忘れた名前をまた忘れた。</span></span></article><article class="example" data-number="39" id="s039"><header class="example-head"><span class="folio">039</span><div class="tag-list"><a class="tag" href="#/word/have" title="have · E">have · E</a></div></header><span class="pair"><span aria-describedby="tr-039" class="utter" lang="en-GB" tabindex="0">He <strong class="verb past" data-verb="have" title="have · 過去形">had</strong> a key because he had <strong class="verb participle" data-verb="have" title="have · 過去分詞">had</strong> a spare one for years.</span><span class="trans" id="tr-039" lang="ja">彼は何年も前から予備の鍵を持っていたので、鍵を持っていた。</span></span></article><article class="example" data-number="40" id="s040"><header class="example-head"><span class="folio">040</span><div class="tag-list"><a class="tag" href="#/word/lay" title="lay · I">lay · I</a></div></header><span class="pair"><span aria-describedby="tr-040" class="utter" lang="en-GB" tabindex="0">She <strong class="verb past" data-verb="lay" title="lay · 過去形">laid</strong> the book on the desk where she had <strong class="verb participle" data-verb="lay" title="lay · 過去分詞">laid</strong> the map.</span><span class="trans" id="tr-040" lang="ja">彼女は以前地図を置いた机の上に本を置いた。</span></span></article></div><nav aria-label="巻移動" class="movement"><a href="#/chapter/1">← 前の巻</a><a href="#/words">共通Indexと語彙索引</a><a href="#/chapter/3">次の巻 →</a></nav></template>
<template id="view-chapter-3"><section class="lead"><p class="eyebrow">Volume 03 · Sentences 041–060</p><h1>言葉と選択</h1><p class="lede">Words and Decisions · 英文と訳を一文ずつ対応させ、過去形と過去分詞を同じ文の中で確認します。</p><div class="legend"><span><strong class="verb past">過去形</strong>：例文中の過去形</span><span><strong class="verb participle">過去分詞</strong>：例文中の過去分詞</span><span>英文をホバー／タップすると日本語訳を表示</span></div><p class="about">E・I・PEUに含まれる137レコードのみを学習対象とし、P・OALD限定レコードは扱いません。</p></section><div class="examples"><article class="example" data-number="41" id="s041"><header class="example-head"><span class="folio">041</span><div class="tag-list"><a class="tag" href="#/word/lead" title="lead · I">lead · I</a></div></header><span class="pair"><span aria-describedby="tr-041" class="utter" lang="en-GB" tabindex="0">He <strong class="verb past" data-verb="lead" title="lead · 過去形">led</strong> the group along the path he had <strong class="verb participle" data-verb="lead" title="lead · 過去分詞">led</strong> them down last summer.</span><span class="trans" id="tr-041" lang="ja">彼は去年の夏にも案内した道に沿って一行を導いた。</span></span></article><article class="example" data-number="42" id="s042"><header class="example-head"><span class="folio">042</span><div class="tag-list"><a class="tag" href="#/word/lean" title="lean · PEU">lean · PEU</a></div></header><span class="pair"><span aria-describedby="tr-042" class="utter" lang="en-GB" tabindex="0">She <strong class="verb past" data-verb="lean" title="lean · 過去形">leant</strong> against the wall as she had <strong class="verb participle" data-verb="lean" title="lean · 過去分詞">leant</strong> against it years ago.</span><span class="trans" id="tr-042" lang="ja">彼女は何年も前にそうしたように壁に寄り掛かった。</span></span></article><article class="example" data-number="43" id="s043"><header class="example-head"><span class="folio">043</span><div class="tag-list"><a class="tag" href="#/word/leap" title="leap · PEU">leap · PEU</a></div></header><span class="pair"><span aria-describedby="tr-043" class="utter" lang="en-GB" tabindex="0">The boy <strong class="verb past" data-verb="leap" title="leap · 過去形">leapt</strong> across the stream as he had <strong class="verb participle" data-verb="leap" title="leap · 過去分詞">leapt</strong> across a smaller one the week before.</span><span class="trans" id="tr-043" lang="ja">少年は前の週にもっと小さな小川を飛び越えたときと同じように、その小川を飛び越えた。</span></span></article><article class="example" data-number="44" id="s044"><header class="example-head"><span class="folio">044</span><div class="tag-list"><a class="tag" href="#/word/learn" title="learn · E">learn · E</a></div></header><span class="pair"><span aria-describedby="tr-044" class="utter" lang="en-GB" tabindex="0">She <strong class="verb past" data-verb="learn" title="learn · 過去形">learnt</strong> the song more quickly because she had <strong class="verb participle" data-verb="learn" title="learn · 過去分詞">learnt</strong> its words before.</span><span class="trans" id="tr-044" lang="ja">彼女は歌詞を以前に覚えていたので、その歌をより早く覚えられた。</span></span></article><article class="example" data-number="45" id="s045"><header class="example-head"><span class="folio">045</span><div class="tag-list"><a class="tag" href="#/word/leave" title="leave · E">leave · E</a></div></header><span class="pair"><span aria-describedby="tr-045" class="utter" lang="en-GB" tabindex="0">He <strong class="verb past" data-verb="leave" title="leave · 過去形">left</strong> the house after his sister had <strong class="verb participle" data-verb="leave" title="leave · 過去分詞">left</strong> for school.</span><span class="trans" id="tr-045" lang="ja">姉が学校へ出発した後で、彼は家を出た。</span></span></article><article class="example" data-number="46" id="s046"><header class="example-head"><span class="folio">046</span><div class="tag-list"><a class="tag" href="#/word/lend" title="lend · E">lend · E</a></div></header><span class="pair"><span aria-describedby="tr-046" class="utter" lang="en-GB" tabindex="0">She <strong class="verb past" data-verb="lend" title="lend · 過去形">lent</strong> him the book she had <strong class="verb participle" data-verb="lend" title="lend · 過去分詞">lent</strong> his brother before.</span><span class="trans" id="tr-046" lang="ja">彼女は以前彼の兄弟に貸した本を彼にも貸した。</span></span></article><article class="example" data-number="47" id="s047"><header class="example-head"><span class="folio">047</span><div class="tag-list"><a class="tag" href="#/word/lie" title="lie · E">lie · E</a></div></header><span class="pair"><span aria-describedby="tr-047" class="utter" lang="en-GB" tabindex="0">The dog <strong class="verb past" data-verb="lie" title="lie · 過去形">lay</strong> in the sun where it had <strong class="verb participle" data-verb="lie" title="lie · 過去分詞">lain</strong> all morning.</span><span class="trans" id="tr-047" lang="ja">犬は午前中ずっと寝そべっていた日なたに、また寝そべった。</span></span></article><article class="example" data-number="48" id="s048"><header class="example-head"><span class="folio">048</span><div class="tag-list"><a class="tag" href="#/word/light" title="light · I">light · I</a></div></header><span class="pair"><span aria-describedby="tr-048" class="utter" lang="en-GB" tabindex="0">She <strong class="verb past" data-verb="light" title="light · 過去形">lit</strong> the candle she had <strong class="verb participle" data-verb="light" title="light · 過去分詞">lit</strong> on every winter evening.</span><span class="trans" id="tr-048" lang="ja">彼女は冬の夕方ごとにともしてきたろうそくに火をともした。</span></span></article><article class="example" data-number="49" id="s049"><header class="example-head"><span class="folio">049</span><div class="tag-list"><a class="tag" href="#/word/make" title="make · E">make · E</a></div></header><span class="pair"><span aria-describedby="tr-049" class="utter" lang="en-GB" tabindex="0">The artist <strong class="verb past" data-verb="make" title="make · 過去形">made</strong> a model like the one she had <strong class="verb participle" data-verb="make" title="make · 過去分詞">made</strong> for the museum.</span><span class="trans" id="tr-049" lang="ja">その芸術家は博物館のために以前作った -head"><span class="folio">053</span><div class="tag-list"><a class="tag" href="#/word/prove" title="prove · PEU">prove · PEU</a></div></header><span class="pair"><span aria-describedby="tr-053" class="utter" lang="en-GB" tabindex="0">The study <strong class="verb past" data-verb="prove" title="prove · 過去形">proved</strong> the rule after earlier research had <strong class="verb participle" data-verb="prove" title="prove · 過去分詞">proved</strong> only part of it.</span><span class="trans" id="tr-053" lang="ja">以前の研究では規則の一部しか証明できなかったが、その研究は規則全体を証明した。</span></span></article><article class="example" data-number="54" id="s054"><header class="example-head"><span class="folio">054</span><div class="tag-list"><a class="tag" href="#/word/put" title="put · E">put · E</a></div></header><span class="pair"><span aria-describedby="tr-054" class="utter" lang="en-GB" tabindex="0">She <strong class="verb past" data-verb="put" title="put · 過去形">put</strong> the photograph beside the one she had <strong class="verb participle" data-verb="put" title="put · 過去分詞">put</strong> on the table yesterday.</span><span class="trans" id="tr-054" lang="ja">彼女は昨日テーブルに置いた写真の隣に、別の写真を置いた。</span></span></article><article class="example" data-number="55" id="s055"><header class="example-head"><span class="folio">055</span><div class="tag-list"><a class="tag" href="#/word/quit" title="quit · I">quit · I</a></div></header><span class="pair"><span aria-describedby="tr-055" class="utter" lang="en-GB" tabindex="0">He <strong class="verb past" data-verb="quit" title="quit · 過去形">quit</strong> his job after he had <strong class="verb participle" data-verb="quit" title="quit · 過去分詞">quit</strong> another job for the same reason.</span><span class="trans" id="tr-055" lang="ja">彼は同じ理由で別の仕事も辞めた後、今回の仕事も辞めた。</span></span></article><article class="example" data-number="56" id="s056"><header class="example-head"><span class="folio">056</span><div class="tag-list"><a class="tag" href="#/word/read" title="read · E">read · E</a></div></header><span class="pair"><span aria-describedby="tr-056" class="utter" lang="en-GB" tabindex="0">She <strong class="verb past" data-verb="read" title="read · 過去形">read</strong> the letter in a loud voice after she had <strong class="verb participle" data-verb="read" title="read · 過去分詞">read</strong> it in silence.</span><span class="trans" id="tr-056" lang="ja">彼女は手紙を黙読した後で声に出して読んだ。</span></span></article><article class="example" data-number="57" id="s057"><header class="example-head"><span class="folio">057</span><div class="tag-list"><a class="tag" href="#/word/rid" title="rid · I">rid · I</a></div></header><span class="pair"><span aria-describedby="tr-057" class="utter" lang="en-GB" tabindex="0">The team <strong class="verb past" data-verb="rid" title="rid · 過去形">rid</strong> the room of dust after it had <strong class="verb participle" data-verb="rid" title="rid · 過去分詞">rid</strong> the hall of rubbish.</span><span class="trans" id="tr-057" lang="ja">チームは廊下のごみを取り除いた後で部屋のほこりを取り除いた。</span></span></article><article class="example" data-number="58" id="s058"><header class="example-head"><span class="folio">058</span><div class="tag-list"><a class="tag" href="#/word/ring" title="ring · E">ring · E</a></div></header><span class="pair"><span aria-describedby="tr-058" class="utter" lang="en-GB" tabindex="0">The bell <strong class="verb past" data-verb="ring" title="ring · 過去形">rang</strong> after it had <strong class="verb participle" data-verb="ring" title="ring · 過去分詞">rung</strong> twice before.</span><span class="trans" id="tr-058" lang="ja">鐘はすでに二度鳴った後で、また鳴った。</span></span></article><article class="example" data-number="59" id="s059"><header class="example-head"><span class="folio">059</span><div class="tag-list"><a class="tag" href="#/word/see" title="see · E">see · E</a></div></header><span class="pair"><span aria-describedby="tr-059" class="utter" lang="en-GB" tabindex="0">She <strong class="verb past" data-verb="see" title="see · 過去形">saw</strong> the bridge she had <strong class="verb participle" data-verb="see" title="see · 過去分詞">seen</strong> in an old picture.</span><span class="trans" id="tr-059" lang="ja">彼女は昔の写真で見た橋を実際に見た。</span></span></article><article class="example" data-number="60" id="s060"><header class="example-head"><span class="folio">060</span><div class="tag-list"><a class="tag" href="#/word/sell" title="sell · E">sell · E</a></div></header><span class="pair"><span aria-describedby="tr-060" class="utter" lang="en-GB" tabindex="0">They <strong class="verb past" data-verb="sell" title="sell · 過去形">sold</strong> the old chairs after they had <strong class="verb participle" data-verb="sell" title="sell · 過去分詞">sold</strong> the tables.</span><span class="trans" id="tr-060" lang="ja">彼らはテーブルを売った後で古い椅子を売った。</span></span></article></div><nav aria-label="巻移動" class="movement"><a href="#/chapter/2">← 前の巻</a><a href="#/words">共通Indexと語彙索引</a><a href="#/chapter/4">次の巻 →</a></nav></template>
<template id="view-chapter-4"><section class="lead"><p class="eyebrow">Volume 04 · Sentences 061–080</p><h1>暮らしの手触り</h1><p class="lede">Everyday Life · 英文と訳を一文ずつ対応させ、過去形と過去分詞を同じ文の中で確認します。</p><div class="legend"><span><strong class="verb past">過去形</strong>：例文中の過去形</span><span><strong class="verb participle">過去分詞</strong>：例文中の過去分詞</span><span>英文をホバー／タップすると日本語訳を表示</span></div><p class="about">E・I・PEUに含まれる137レコードのみを学習対象とし、P・OALD限定レコードは扱いません。</p></section><div class="examples"><article class="example" data-number="61" id="s061"><header class="example-head"><span class="folio">061</span><div class="tag-list"><a class="tag" href="#/word/send" title="send · E">send · E</a></div></header><span class="pair"><span aria-describedby="tr-061" class="utter" lang="en-GB" tabindex="0">She <strong class="verb past" data-verb="send" title="send · 過去形">sent</strong> the letter after she had <strong class="verb participle" data-verb="send" title="send · 過去分詞">sent</strong> the photograph.</span><span class="trans" id="tr-061" lang="ja">彼女は写真を送った後で手紙を送った。</span></span></article><article class="example" data-number="62" id="s062"><header class="example-head"><span class="folio">062</span><div class="tag-list"><a class="tag" href="#/word/set" title="set · I">set · I</a></div></header><span class="pair"><span aria-describedby="tr-062" class="utter" lang="en-GB" tabindex="0">He <strong class="verb past" data-verb="set" title="set · 過去形">set</strong> the clock to eight after he had <strong class="verb participle" data-verb="set" title="set · 過去分詞">set</strong> it to seven by mistake.</span><span class="trans" id="tr-062" lang="ja">彼は間違えて時計を7時に合わせた後で、8時に合わせ直した。</span></span></article><article class="example" data-number="63" id="s063"><header class="example-head"><span class="folio">063</span><div class="tag-list"><a class="tag" href="#/word/sew" title="sew · I">sew · I</a></div></header><span class="pair"><span aria-describedby="tr-063" class="utter" lang="en-GB" tabindex="0">She <strong class="verb past" data-verb="sew" title="sew · 過去形">sewed</strong> a new button onto the coat she had <strong class="verb participle" data-verb="sew" title="sew · 過去分詞">sewn</strong> for her daughter.</span><span class="trans" id="tr-063" lang="ja">彼女は娘のために縫ったコートに新しいボタンを縫い付けた。</span></span></article><article class="example" data-number="64" id="s064"><header class="example-head"><span class="folio">064</span><div class="tag-list"><a class="tag" href="#/word/shake" title="shake · E">shake · E</a></div></header><span class="pair"><span aria-describedby="tr-064" class="utter" lang="en-GB" tabindex="0">The storm <strong class="verb past" data-verb="shake" title="shake · 過去形">shook</strong> the house as it had <strong class="verb participle" data-verb="shake" title="shake · 過去分詞">shaken</strong> the trees the night before.</span><span class="trans" id="tr-064" lang="ja">嵐は前夜に木々を揺らしたように家を揺らした。</span></span></article><article class="example" data-number="65" id="s065"><header class="example-head"><span class="folio">065</span><div class="tag-list"><a class="tag" href="#/word/shine" title="shine · E">shine · E</a></div></header><span class="pair"><span aria-describedby="tr-065" class="utter" lang="en-GB" tabindex="0">The sun <strong class="verb past" data-verb="shine" title="shine · 過去形">shone</strong> on the garden where it had <strong class="verb participle" data-verb="shine" title="shine · 過去分詞">shone</strong> the day before.</span><span class="trans" id="tr-065" lang="ja">太陽は前日にも光が当たっていた庭に再び日を照らした。</span></span></article><article class="example" data-number="66" id="s066"><header class="example-head"><span class="folio">066</span><div class="tag-list"><a class="tag" href="#/word/shrink" title="shrink · PEU">shrink · PEU</a></div></header><span class="pair"><span aria-describedby="tr-066" class="utter" lang="en-GB" tabindex="0">The wool coat <strong class="verb past" data-verb="shrink" title="shrink · 過去形">shrank</strong> in the wash although it had already <strong class="ve word/speed" title="speed · I">speed · I</a></div></header><span class="pair"><span aria-describedby="tr-073" class="utter" lang="en-GB" tabindex="0">The car <strong class="verb past" data-verb="speed" title="speed · 過去形">sped</strong> along the road as it had <strong class="verb participle" data-verb="speed" title="speed · 過去分詞">sped</strong> along the same road the night before.</span><span class="trans" id="tr-073" lang="ja">車は前夜にも走った同じ道を勢いよく走った。</span></span></article><article class="example" data-number="74" id="s074"><header class="example-head"><span class="folio">074</span><div class="tag-list"><a class="tag" href="#/word/spell" title="spell · E">spell · E</a></div></header><span class="pair"><span aria-describedby="tr-074" class="utter" lang="en-GB" tabindex="0">She <strong class="verb past" data-verb="spell" title="spell · 過去形">spelt</strong> the name correctly because she had <strong class="verb participle" data-verb="spell" title="spell · 過去分詞">spelt</strong> it wrong before.</span><span class="trans" id="tr-074" lang="ja">彼女は以前その名前を間違って綴ったので、今回は正しく綴った。</span></span></article><article class="example" data-number="75" id="s075"><header class="example-head"><span class="folio">075</span><div class="tag-list"><a class="tag" href="#/word/spend" title="spend · E">spend · E</a></div></header><span class="pair"><span aria-describedby="tr-075" class="utter" lang="en-GB" tabindex="0">He <strong class="verb past" data-verb="spend" title="spend · 過去形">spent</strong> the money from his last job, just as he had <strong class="verb participle" data-verb="spend" title="spend · 過去分詞">spent</strong> his pay the month before.</span><span class="trans" id="tr-075" lang="ja">彼は先月給料を使ったのと同じように、前の仕事で得たお金を使った。</span></span></article><article class="example" data-number="76" id="s076"><header class="example-head"><span class="folio">076</span><div class="tag-list"><a class="tag" href="#/word/spill" title="spill · I">spill · I</a></div></header><span class="pair"><span aria-describedby="tr-076" class="utter" lang="en-GB" tabindex="0">She <strong class="verb past" data-verb="spill" title="spill · 過去形">spilt</strong> the milk after she had <strong class="verb participle" data-verb="spill" title="spill · 過去分詞">spilt</strong> the water.</span><span class="trans" id="tr-076" lang="ja">彼女は水をこぼした後で牛乳もこぼした。</span></span></article><article class="example" data-number="77" id="s077"><header class="example-head"><span class="folio">077</span><div class="tag-list"><a class="tag" href="#/word/spin" title="spin · PEU">spin · PEU</a></div></header><span class="pair"><span aria-describedby="tr-077" class="utter" lang="en-GB" tabindex="0">The wheel <strong class="verb past" data-verb="spin" title="spin · 過去形">spun</strong> faster than it had <strong class="verb participle" data-verb="spin" title="spin · 過去分詞">spun</strong> the day before.</span><span class="trans" id="tr-077" lang="ja">車輪は前日より速く回転した。</span></span></article><article class="example" data-number="78" id="s078"><header class="example-head"><span class="folio">078</span><div class="tag-list"><a class="tag" href="#/word/spit" title="spit · PEU">spit · PEU</a></div></header><span class="pair"><span aria-describedby="tr-078" class="utter" lang="en-GB" tabindex="0">The child <strong class="verb past" data-verb="spit" title="spit · 過去形">spat</strong> the seeds onto the ground after he had <strong class="verb participle" data-verb="spit" title="spit · 過去分詞">spat</strong> the first one into his hand.</span><span class="trans" id="tr-078" lang="ja">子どもは最初の種を手に吐き出した後、残りの種を地面に吐き出した。</span></span></article><article class="example" data-number="79" id="s079"><header class="example-head"><span class="folio">079</span><div class="tag-list"><a class="tag" href="#/word/split" title="split · PEU">split · PEU</a></div></header><span class="pair"><span aria-describedby="tr-079" class="utter" lang="en-GB" tabindex="0">They <strong class="verb past" data-verb="split" title="split · 過去形">split</strong> the cost after 過去形">struck</strong> twelve after it had <strong class="verb participle" data-verb="strike" title="strike · 過去分詞">struck</strong> eleven an hour earlier.</span><span class="trans" id="tr-086" lang="ja">時計は一時間前に11時を打った後、12時を打った。</span></span></article><article class="example" data-number="87" id="s087"><header class="example-head"><span class="folio">087</span><div class="tag-list"><a class="tag" href="#/word/swear" title="swear · PEU">swear · PEU</a></div></header><span class="pair"><span aria-describedby="tr-087" class="utter" lang="en-GB" tabindex="0">He <strong class="verb past" data-verb="swear" title="swear · 過去形">swore</strong> on the book after he had <strong class="verb participle" data-verb="swear" title="swear · 過去分詞">sworn</strong> on the same book years before.</span><span class="trans" id="tr-087" lang="ja">彼は何年も前に同じ本にかけて誓ったことがあり、今回もその本にかけて誓った。</span></span></article><article class="example" data-number="88" id="s088"><header class="example-head"><span class="folio">088</span><div class="tag-list"><a class="tag" href="#/word/sweep" title="sweep · I">sweep · I</a></div></header><span class="pair"><span aria-describedby="tr-088" class="utter" lang="en-GB" tabindex="0">She <strong class="verb past" data-verb="sweep" title="sweep · 過去形">swept</strong> the floor after she had <strong class="verb participle" data-verb="sweep" title="sweep · 過去分詞">swept</strong> the front steps.</span><span class="trans" id="tr-088" lang="ja">彼女は玄関前の階段を掃いた後で床を掃いた。</span></span></article><article class="example" data-number="89" id="s089"><header class="example-head"><span class="folio">089</span><div class="tag-list"><a class="tag" href="#/word/swing" title="swing · PEU">swing · PEU</a></div></header><span class="pair"><span aria-describedby="tr-089" class="utter" lang="en-GB" tabindex="0">The door <strong class="verb past" data-verb="swing" title="swing · 過去形">swung</strong> open as it had <strong class="verb participle" data-verb="swing" title="swing · 過去分詞">swung</strong> open in the wind the night before.</span><span class="trans" id="tr-089" lang="ja">ドアは前夜に風で開いたのと同じように、また揺れて開いた。</span></span></article><article class="example" data-number="90" id="s090"><header class="example-head"><span class="folio">090</span><div class="tag-list"><a class="tag" href="#/word/teach" title="teach · E">teach · E</a></div></header><span class="pair"><span aria-describedby="tr-090" class="utter" lang="en-GB" tabindex="0">The teacher <strong class="verb past" data-verb="teach" title="teach · 過去形">taught</strong> the lesson she had <strong class="verb participle" data-verb="teach" title="teach · 過去分詞">taught</strong> to another class last year.</span><span class="trans" id="tr-090" lang="ja">教師は前年に別のクラスにも教えた授業内容を教えた。</span></span></article><article class="example" data-number="91" id="s091"><header class="example-head"><span class="folio">091</span><div class="tag-list"><a class="tag" href="#/word/tear" title="tear · I">tear · I</a></div></header><span class="pair"><span aria-describedby="tr-091" class="utter" lang="en-GB" tabindex="0">He <strong class="verb past" data-verb="tear" title="tear · 過去形">tore</strong> the paper after he had <strong class="verb participle" data-verb="tear" title="tear · 過去分詞">torn</strong> the old letter.</span><span class="trans" id="tr-091" lang="ja">彼は古い手紙を破った後で紙を破った。</span></span></article><article class="example" data-number="92" id="s092"><header class="example-head"><span class="folio">092</span><div class="tag-list"><a class="tag" href="#/word/tell" title="tell · E">tell · E</a></div></header><span class="pair"><span aria-describedby="tr-092" class="utter" lang="en-GB" tabindex="0">She <strong class="verb past" data-verb="tell" title="tell · 過去形">told</strong> the story she had <strong class="verb participle" data-verb="tell" title="tell · 過去分詞">told</strong> her friend years before.</span><span class="trans" id="tr-092" lang="ja">彼女は何年も前に友人に語った話をまた語った。</span></span></article><article class="example" data-number="93" id="s093"><header class="example-head"><span class="folio">093</span><div class="tag-list"><a class="tag" href="#/word/think" title="think · E">think · E</a></div></header><span class="pair"><span aria-describedby="tr-093" class="utter" lang="en-GB" tabindex="0">He <strong class="verb past" data-verb="think" title="think · 過去形">thought</strong> about the question he had <strong class="verb participle" data-verb="think" title="think · 過去分詞">thought</strong> about all night.</span><span class="trans" id="tr-093" lang="ja">彼は一晩中考えた問題について、また考えた。</span></span></article><article class="example" data-number="94" id="s094"><header class="example-head"><span class="folio">094</span><div class="tag-list"><a class="tag" href="#/word/throw" title="throw · E">throw · E</a></div></header><span class="pair"><span aria-describedby="tr-094" class="utter" lang="en-GB" tabindex="0">She <strong class="verb past" data-verb="throw" title="throw · 過去形">threw</strong> the stone where her brother had <strong class="verb participle" data-verb="throw" title="throw · 過去分詞">thrown</strong> one earlier.</span><span class="trans" id="tr-094" lang="ja">彼女は先ほど兄が石を投げた場所に石を投げた。</span></span></article><article class="example" data-number="95" id="s095"><header class="example-head"><span class="folio">095</span><div class="tag-list"><a class="tag" href="#/word/understand" title="understand · E">understand · E</a></div></header><span class="pair"><span aria-describedby="tr-095" class="utter" lang="en-GB" tabindex="0">The child <strong class="verb past" data-verb="understand" title="understand · 過去形">understood</strong> the message after she had <strong class="verb participle" data-verb="understand" title="understand · 過去分詞">understood</strong> the meaning of each word.</span><span class="trans" id="tr-095" lang="ja">子どもは一つ一つの単語の意味を理解した後で、メッセージ全体を理解した。</span></span></article><article class="example" data-number="96" id="s096"><header class="example-head"><span class="folio">096</span><div class="tag-list"><a class="tag" href="#/word/undo" title="undo · I">undo · I</a></div></header><span class="pair"><span aria-describedby="tr-096" class="utter" lang="en-GB" tabindex="0">He <strong class="verb past" data-verb="undo" title="undo · 過去形">undid</strong> the first button after he had <strong class="verb participle" data-verb="undo" title="undo · 過去分詞">undone</strong> the others.</span><span class="trans" id="tr-096" lang="ja">彼はほかのボタンを外した後で最初のボタンを外した。</span></span></article><article class="example" data-number="97" id="s097"><header class="example-head"><span class="folio">097</span><div class="tag-list"><a class="tag" href="#/word/upset" title="upset · I">upset · I</a></div></header><span class="pair"><span aria-describedby="tr-097" class="utter" lang="en-GB" tabindex="0">The news <strong class="verb past" data-verb="upset" title="upset · 過去形">upset</strong> her more than the letter had <strong class="verb participle" data-verb="upset" title="upset · 過去分詞">upset</strong> her.</span><span class="trans" id="tr-097" lang="ja">その知らせは手紙以上に彼女を動揺させた。</span></span></article><article class="example" data-number="98" id="s098"><header class="example-head"><span class="folio">098</span><div class="tag-list"><a class="tag" href="#/word/wake" title="wake · E">wake · E</a></div></header><span class="pair"><span aria-describedby="tr-098" class="utter" lang="en-GB" tabindex="0">She <strong class="verb past" data-verb="wake" title="wake · 過去形">woke</strong> before breakfast because she had <strong class="verb participle" data-verb="wake" title="wake · 過去分詞">woken</strong> at the same time all week.</span><span class="trans" id="tr-098" lang="ja">彼女は一週間ずっと同じ時刻に目覚めていたので、朝食前に目覚めた。</span></span></article><article class="example" data-number="99" id="s099"><header class="example-head"><span class="folio">099</span><div class="tag-list"><a class="tag" href="#/word/wind" title="wind · PEU">wind · PEU</a></div></header><span class="pair"><span aria-describedby="tr-099" class="utter" lang="en-GB" tabindex="0">He <strong class="verb past" data-verb="wind" title="wind · 過去形">wound</strong> the clock as his father had <strong class="verb participle" data-verb="wind" title="wind · 過去分詞">wound</strong> it every Sunday.</span><span class="trans" id="tr-099" lang="ja">彼は父が毎週日曜日にねじを巻いていたように時計のねじを巻いた。</span></span></article><article class="example" data-number="100" id="s100"><header class="example-head"><span class="folio">100</span><div class="tag-list"><a class="tag" href="#/word/write" title="write · E">write · E</a></div></header><span class="pair"><span aria-describedby="tr-100" class="utter" lang="en-GB" tabindex="0">She <strong class="verb past" data-verb="write" title="write · 過去形">wrote</strong> the final page after she had <strong class="verb participle" data-verb="write" title="write · 過去分詞">written</strong> the first one in spring.</span><span class="trans" id="tr-100" lang="ja">彼女は春に最初のページを書いた後で、最後のページを書いた。</span></span></article></div><nav aria-label="巻移動" class="movement"><a href="#/chapter/4">← 前の巻</a><a href="#/words">共通Indexと語彙索引</a></nav></template>
</div>
<script>
(()=>{
'use strict';
const view=document.querySelector('#view');
const tip=document.querySelector('#tooltip');
const toggle=document.querySelector('#mode');
const nav=document.querySelector('#main-nav');
const label=document.querySelector('#view-label');
const menu=document.querySelector('#contents-menu');
const names=['はじまりの問い','川と道の記憶','言葉と選択','暮らしの手触り','次の朝へ'];
const chapterNodes=[null,...[1,2,3,4,5].map(i=>document.querySelector('#view-chapter-'+i).content)];
const indexNodes=Object.fromEntries(['home','search','words','scope','help'].map(n=>[n,document.querySelector('#view-'+n).content]));
const exampleMap=new Map();
const wordMap=new Map();
for(let i=1;i<=5;i++)for(const article of chapterNodes[i].querySelectorAll('article.example')){
 const n=Number(article.dataset.number); exampleMap.set(n,{chapter:i,article});
}
for(const a of indexNodes.words.querySelectorAll('a.word')){
 const w=a.id.slice(5).toLowerCase();const m=a.getAttribute('href')?.match(/^#\/sentence\/(\d{3})$/);
 if(m)wordMap.set(w,{number:Number(m[1]),label:a.title,group:a.querySelector('span')?.textContent});
}
let active=null,showAll=false,keyboardFocus=false;
try{showAll=localStorage.getItem('iv100:translations')==='all'}catch(e){}
function closeTooltip(){if(active)active.classList.remove('active');active=null;tip.hidden=true}
function openTooltip(el){if(!el||showAll)return;const pair=el.closest('.pair');if(!pair)return;const translated=pair.querySelector('.trans');if(!translated)return;
 closeTooltip();active=el;el.classList.add('active');tip.textContent=translated.textContent;tip.hidden=false;
 const r=el.getBoundingClientRect(),w=tip.offsetWidth,h=tip.offsetHeight;
 let x=Math.max(12,Math.min(window.innerWidth-w-12,r.left)),y=r.bottom+8;
 if(y+h>window.innerHeight-10)y=Math.max(10,r.top-h-8);
 tip.style.left=x+'px';tip.style.top=y+'px';}
function applyTranslation(){document.body.classList.toggle('showall',showAll);toggle.setAttribute('aria-checked',String(showAll));closeTooltip()}
toggle.addEventListener('click',()=>{showAll=!showAll;try{localStorage.setItem('iv100:translations',showAll?'all':'hover')}catch(e){}applyTranslation()});
document.addEventListener('pointerover',e=>{if(e.pointerType==='mouse'){const el=e.target.closest?.('.utter');if(el)openTooltip(el)}});
document.addEventListener('pointerout',e=>{if(e.pointerType==='mouse'&&!e.relatedTarget?.closest?.('.utter'))closeTooltip()});
document.addEventListener('click',e=>{const el=e.target.closest?.('.utter');if(!el){closeTooltip();return}if(e.pointerType!=='mouse'){if(active===el)closeTooltip();else openTooltip(el)}});
document.addEventListener('pointerdown',()=>{keyboardFocus=false});
document.addEventListener('focusin',e=>{if(keyboardFocus&&e.target.matches('.utter'))openTooltip(e.target)});
document.addEventListener('focusout',e=>{if(e.target.matches('.utter'))closeTooltip()});
document.addEventListener('keydown',e=>{if(e.key==='Tab')keyboardFocus=true;if(e.key==='Escape')closeTooltip()});
window.addEventListener('scroll',closeTooltip,{passive:true});window.addEventListener('resize',()=>{closeTooltip();if(window.innerWidth>840)menu.open=true});

function renderNode(src){view.replaceChildren(src.cloneNode(true))}
function top(){window.scrollTo({top:0,behavior:'instant'})}
function title(t){document.title=t+'｜Irregular Verbs 100';label.textContent=t}
function markNav(id){for(const a of nav.querySelectorAll('a[data-nav]')){if(a.dataset.nav===id)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')}}
function breadcrumbs(ch){return '<p class="crumb"><a href="#/home">全体Index</a> / <a href="#/chapter/'+ch+'">'+names[ch-1]+'</a></p>'}
function renderSingle(number,word){const record=exampleMap.get(number);if(!record)return false;
 const article=record.article.cloneNode(true);article.classList.add('is-target');
 const ch=record.chapter;const wordRec=word?wordMap.get(word):null;
 const lead=document.createElement('section');lead.className='lead';
 const eyebrow=word?'VERB INDEX · '+(wordRec?.group||''):'SENTENCE · '+String(number).padStart(3,'0');
 const suffix=word?'<h1 class="single-title">'+escapeHTML(word)+'</h1><p class="lede">'+escapeHTML(wordRec?.label||'')+'</p>':'<h1 class="single-title">例文 '+String(number).padStart(3,'0')+'</h1><p class="lede">'+names[ch-1]+' · 単独表示</p>';
 lead.innerHTML=breadcrumbs(ch)+'<p class="eyebrow">'+eyebrow+'</p>'+suffix+'<div class="legend"><span><strong class="verb past">過去形</strong></span><span><strong class="verb participle">過去分詞</strong></span><span>英文をホバー／タップで日本語訳</span></div>';
 const holder=document.createElement('div');holder.className='examples';holder.appendChild(article);
 const controls=document.createElement('nav');controls.className='single-controls';controls.setAttribute('aria-label','表示の切替');controls.innerHTML='<a href="#/chapter/'+ch+'">この巻の20例文を表示</a><a href="#/search">100文を検索</a><a href="#/words">動詞索引</a>';
 const navS=document.createElement('nav');navS.className='single-nav';navS.setAttribute('aria-label','前後の例文');
 navS.innerHTML=(number>1?'<a href="#/sentence/'+String(number-1).padStart(3,'0')+'">← '+String(number-1).padStart(3,'0')+'</a>':'<span></span>')+(number<100?'<a href="#/sentence/'+String(number+1).padStart(3,'0')+'">'+String(number+1).padStart(3,'0')+' →</a>':'');
 view.replaceChildren(lead,holder,controls,navS);
 if(word){for(const item of article.querySelectorAll('[data-verb]'))if(item.dataset.verb.toLowerCase()===word){item.classList.add('is-selected-verb')}}
 title((word?word+' · ':'')+'例文 '+String(number).padStart(3,'0'));
 markNav('chapter/'+ch);return true;
}
function escapeHTML(str){return String(str||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const searchState={q:'',g:''};
function activateSearch(){const search=view.querySelector('#search'),group=view.querySelector('#group'),items=[...view.querySelectorAll('.result')],count=view.querySelector('#result-count');
 search.value=searchState.q;group.value=searchState.g;
 const run=()=>{searchState.q=search.value;searchState.g=group.value;const q=search.value.trim().toLowerCase(),g=group.value;let n=0;for(const item of items){const match=(!q||item.dataset.search.includes(q))&&(!g||item.dataset.group===g);item.hidden=!match;if(match)n++}count.textContent=n+' / '+items.length+' 文'};
 search.addEventListener('input',run);group.addEventListener('change',run);run();
}

const wordFilterState={pattern:'',group:'',initial:'',query:''};
function activateWords(){
 const pattern=view.querySelector('#word-pattern'),group=view.querySelector('#word-group'),initial=view.querySelector('#word-initial'),query=view.querySelector('#word-query');
 const count=view.querySelector('#word-result-count'),empty=view.querySelector('#word-empty'),reset=view.querySelector('#word-clear');
 const items=[...view.querySelectorAll('a.word')];
 for(const [field,el] of [['pattern',pattern],['group',group],['initial',initial],['query',query]])el.value=wordFilterState[field];
 function run(){
  wordFilterState.pattern=pattern.value;wordFilterState.group=group.value;wordFilterState.initial=initial.value;wordFilterState.query=query.value;
  const q=query.value.trim().toLowerCase();let matched=0;
  for(const item of items){
   const match=(!pattern.value||item.dataset.pattern===pattern.value)
     &&(!group.value||item.dataset.group===group.value)
     &&(!initial.value||item.dataset.initial===initial.value)
     &&(!q||item.textContent.toLowerCase().includes(q));
   item.hidden=!match;if(match)matched++;
  }
  count.textContent=matched+' / '+items.length+'語を表示';empty.hidden=matched!==0;
 }
 pattern.addEventListener('change',run);group.addEventListener('change',run);initial.addEventListener('change',run);query.addEventListener('input',run);
 reset.addEventListener('click',()=>{pattern.value='';group.value='';initial.value='';query.value='';run();query.focus()});
 run();
}
function decodeRoute(){let raw=location.hash.slice(1);try{raw=decodeURIComponent(raw)}catch(e){}
 if(!raw||raw==='/')return ['/home',null];
 return [raw,null];}
function route(){closeTooltip();let [raw]=decodeRoute();const parts=raw.split('/').filter(Boolean);let success=true;
 if(parts[0]==='home'||parts.length===0){renderNode(indexNodes.home);title('全体Index');markNav('home')}
 else if(parts[0]==='search'){renderNode(indexNodes.search);activateSearch();title('100例文の検索');markNav('search')}
 else if(parts[0]==='words'){renderNode(indexNodes.words);activateWords();title('137動詞の索引');markNav('words')}
 else if(parts[0]==='scope'){renderNode(indexNodes.scope);title('学習範囲・語彙制限');markNav('scope')}
 else if(parts[0]==='help'){renderNode(indexNodes.help);title('使い方');markNav('help')}
 else if(parts[0]==='chapter' && /^[1-5]$/.test(parts[1]||'')){
 const id=Number(parts[1]);renderNode(chapterNodes[id]);title(names[id-1]+' · 第'+id+'巻');markNav('chapter/'+id);
 }
 else if(parts[0]==='sentence' && /^\d{3}$/.test(parts[1]||''))success=renderSingle(Number(parts[1]),null);
 else if(parts[0]==='word' && parts[1]){const word=parts[1].toLowerCase(),record=wordMap.get(word);success=record?renderSingle(record.number,word):false}
 else success=false;
 if(!success){renderNode(indexNodes.home);title('全体Index');markNav('home')}
 top();applyTranslation();
 if(window.innerWidth<=840)menu.open=false;
}
window.addEventListener('hashchange',route);
// Same-route click: if the address did not change, scroll to top rather than doing nothing.
document.addEventListener('click',event=>{const a=event.target.closest?.('a[href^="#/"]');if(a&&a.hash===location.hash){event.preventDefault();route()}});
applyTranslation();route();
})();
</script>
</body></html>
